
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PASINDU Salary Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#123c69;color:white;padding:20px 12px;text-align:center}
h1{font-size:23px;margin:0 0 8px}
header p{margin:0;font-size:13px}
.summary{background:white;margin:12px;padding:15px;border-radius:12px;text-align:center}
#grand{font-size:26px;color:#087443;font-weight:bold;margin-top:5px}
.people{display:grid;grid-template-columns:repeat(5,minmax(260px,1fr));gap:12px;padding:12px;overflow-x:auto;align-items:start}
.employee{background:white;border-radius:12px;padding:12px;border:1px solid #dbe3ee}
.employee h2{font-size:19px;margin:4px 0;color:#174b83}
.role{color:#64748b;font-size:12px;margin-bottom:12px}
.day{border:1px solid #e2e8f0;border-radius:9px;padding:9px;margin-bottom:8px}
.dayhead{font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between}
.shift{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0}
.shift label{display:flex;align-items:center;gap:5px}
.shift input{width:17px;height:17px}
.daily{font-size:12px;color:#087443;text-align:right;margin-top:5px}
.total{position:sticky;bottom:0;background:#e0f2e9;padding:12px;border-radius:10px;margin-top:12px;font-weight:bold}
.total strong{display:block;font-size:20px;color:#087443;margin-top:5px}
.actions{text-align:center;padding:10px 12px 24px}
button{border:0;border-radius:8px;padding:12px 16px;font-size:15px;margin:4px;cursor:pointer}
.save{background:#174b83;color:white}
.clear{background:#fee2e2;color:#991b1b}
.note{font-size:12px;color:#64748b}
@media(max-width:700px){.people{grid-template-columns:repeat(5,minmax(260px,82vw))}}
</style>
</head>
<body>
<header>
<h1>PASINDU SALARY CALCULATOR</h1>
<p>15-Day Staff Attendance & Salary</p>
</header>

<div class="summary">
<div>ALL STAFF - GRAND TOTAL</div>
<div id="grand">Rs. 0</div>
</div>

<div class="people" id="people"></div>

<div class="actions">
<button class="save" onclick="saveData()">Save Attendance</button>
<button class="clear" onclick="clearData()">Clear All</button>
<p class="note">Data is saved in this browser on this device.</p>
</div>

<script>
const staff=[
{name:"Banusha",role:"Manager",rates:[2050,2300,3100]},
{name:"Pasindu",role:"Manager",rates:[2050,2300,3100]},
{name:"Sajith",role:"Cashier",rates:[1550,1650,2250]},
{name:"Dilki",role:"Cashier",rates:[1550,1650,2250]},
{name:"Orshani",role:"Cashier",rates:[1550,1650,2250]}
];
const shifts=["Day","Evening","Night"];
let data={};

try{data=JSON.parse(localStorage.getItem("pasinduSalary15")||"{}")||{};}catch(e){data={};}

function money(n){return "Rs. "+n.toLocaleString("en-US");}

function draw(){
const root=document.getElementById("people");
root.innerHTML="";
staff.forEach((person,i)=>{
let card=document.createElement("section");
card.className="employee";
card.innerHTML=`<h2>${i+1}. ${person.name}</h2>
<div class="role">${person.role}</div>`;
for(let d=1;d<=15;d++){
let key=i+"-"+d;
let day=document.createElement("div");
day.className="day";
day.innerHTML=`<div class="dayhead"><span>Day ${d}</span><span id="daily-${key}">Rs. 0</span></div>`;
shifts.forEach((s,j)=>{
let checked=!!(data[key]&&data[key][j]);
let line=document.createElement("div");
line.className="shift";
line.innerHTML=`<label><input type="checkbox" data-key="${key}" data-shift="${j}" ${checked?"checked":""}>${s}</label><span>${money(person.rates[j])}</span>`;
day.appendChild(line);
});
card.appendChild(day);
}
let total=document.createElement("div");
total.className="total";
total.innerHTML=`${person.name}'s Total<strong id="total-${i}">Rs. 0</strong>`;
card.appendChild(total);
root.appendChild(card);
});
root.querySelectorAll("input[type=checkbox]").forEach(cb=>{
cb.addEventListener("change",()=>{
let k=cb.dataset.key,j=Number(cb.dataset.shift);
if(!data[k])data[k]=[false,false,false];
data[k][j]=cb.checked;
update();
saveData();
});
});
update();
}

function update(){
let grand=0;
staff.forEach((p,i)=>{
let total=0;
for(let d=1;d<=15;d++){
let k=i+"-"+d, daily=0;
p.rates.forEach((r,j)=>{if(data[k]&&data[k][j])daily+=r;});
total+=daily;
let el=document.getElementById("daily-"+k);
if(el)el.textContent=money(daily);
}
grand+=total;
let el=document.getElementById("total-"+i);
if(el)el.textContent=money(total);
});
document.getElementById("grand").textContent=money(grand);
}

function saveData(){
try{
localStorage.setItem("pasinduSalary15",JSON.stringify(data));
}catch(e){}
}

function clearData(){
if(confirm("Clear all attendance for all staff?")){
data={};
saveData();
draw();
}
}

draw();
</script>
</body>
</html>
